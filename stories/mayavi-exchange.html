    <section class="story-intro">
      <h2>कहानी का परिचय</h2>
      <p>बीस साल का वीर उत्तराखंड के एक छोटे-से पहाड़ी गाँव में अकेला रहता है। उसके दादा जी अपने समय के मशहूर पहाड़ी हकीम और खोजी थे। एक तूफानी रात में वीर को दादा जी का एक रहस्यमयी संदूक मिलता है। उसके भीतर छिपा एक अनोखा खंजर उसकी जिंदगी को एक ऐसी मायावी दुनिया से जोड़ देता है, जहाँ हर चीज़ का मूल्य है और ताकत भी खरीदी जा सकती है।</p>
      <p class="story-copy-note">मूल कहानी हिन्दी में प्रकाशित की जा रही है। अंग्रेज़ी संस्करण बाद में जोड़ा जा सकता है।</p>

    <section class="story-chapter" id="chapter-1" data-chapter="1">
      <h2 data-chapter-title data-hi="अध्याय 1 — दादा जी का संदूक और मायावी शुरुआत" data-en="Chapter 1 — Grandfather's Chest and the Mysterious Beginning">अध्याय 1 — दादा जी का संदूक और मायावी शुरुआत</h2>

      <div class="story-copy story-lang-hi chapter-text protected-content" data-lang="hi">
        <p>पहाड़ों के बीच बसे उत्तराखंड के एक छोटे-से गाँव में बीस साल का वीर अकेला रहता था। उसका पूरा दिन पहाड़ों से लकड़ियाँ काटने और खेतों में काम करने में निकल जाता था।</p>

        <p>वीर के माता-पिता अब इस दुनिया में नहीं थे। उसके साथ बस उसके दादा जी की यादें थीं—दादा जी, जो अपने समय के मशहूर पहाड़ी हकीम और खोजी माने जाते थे। उनके बारे में गाँव में आज भी तरह-तरह की बातें होती थीं, लेकिन उनके जाने के बाद उनके कई रहस्य भी हमेशा के लिए दब गए थे।</p>

        <p>एक शाम अचानक मौसम बिगड़ गया। आसमान काले बादलों से घिर गया और देखते ही देखते मूसलाधार बारिश शुरू हो गई। तेज़ हवा के झोंकों के बीच वीर अपने पुराने घर की छत और दीवारों को बचाने की कोशिश कर ही रहा था कि एक ज़ोरदार आवाज़ के साथ कमरे की एक पुरानी दीवार का हिस्सा ढह गया।</p>

        <img class="story-illustration" src="../assets/stories/mayavi-exchange/chapter-01.png" alt="तूफानी रात में वीर और उसके पुराने घर की रहस्यमयी खोज" loading="lazy">

        <p>वीर कुछ पल तक वहीं खड़ा रहा। फिर उसकी नज़र टूटी हुई दीवार के पीछे पड़ी। वहाँ मिट्टी और पत्थरों के बीच लकड़ी का एक छोटा-सा संदूक छिपा हुआ था। संदूक पर धूल की मोटी परत जमी थी, मानो उसे वर्षों से किसी ने छुआ तक न हो।</p>

        <p>वीर ने सावधानी से संदूक बाहर निकाला। उसके हाथ हल्के-से काँप रहे थे। आखिर ऐसा क्या था जिसे उसके दादा जी ने दीवार के पीछे छिपाकर रखा था?</p>

        <p>उसने संदूक खोला। अंदर एक कपड़े में लिपटी हुई पुरानी पहाड़ी दुलारी रखी थी—एक खास किस्म का छोटा खंजर। उसके हत्थे पर अजीब नीले रत्न जड़े हुए थे। उन रत्नों से हल्की-सी नीली चमक निकल रही थी।</p>

        <p>वीर ने जैसे ही उस खंजर को हाथ में उठाया, उसकी उँगली पर बहुत छोटा-सा कट लग गया। खून की एक बूंद खंजर के नीले रत्न पर गिरी।</p>

        <img class="story-illustration" src="../assets/stories/mayavi-exchange/chapter-01.png" alt="नीले रत्नों वाला रहस्यमयी खंजर" loading="lazy">

        <p>अगले ही पल पूरा कमरा तेज़ सुनहरी रोशनी से भर गया। वीर ने घबराकर खंजर छोड़ना चाहा, लेकिन उससे पहले ही उसकी आँखों के सामने हवा में एक चमकता हुआ, डिजिटल जैसा पर्दा खुल गया।</p>

        <p>उस पर शब्द उभर रहे थे—</p>

        <div class="speech">“मायावी एक्सचेंज सिस्टम में आपका स्वागत है, उत्तराधिकारी!”</div>

        <p>नीचे वीर का नाम और उसका वर्तमान बैलेंस दिखाई दे रहा था:</p>

        <div class="speech">उपयोगकर्ता: वीर<br>वर्तमान बैलेंस: 0 मायावी सिक्के</div>

        <p>फिर एक और संदेश चमका—</p>

        <div class="speech">“प्रथम रक्त अर्पण पुरस्कार: 500 सिक्के + ‘दृष्टि’ क्षमता।”</div>

        <p>वीर की साँसें थम-सी गईं। संदेश के अनुसार ‘दृष्टि’ की मदद से वह किसी भी इंसान या वस्तु का सच देख सकता था। लेकिन इससे भी बड़ा सवाल था—यह सिस्टम केवल उसे ही क्यों दिखाई दे रहा था?</p>

        <p>उसी समय उसकी नज़र कमरे में पड़ी एक पुरानी लकड़ी पर गई। हवा में उसके ऊपर एक नया संदेश दिखाई दिया—</p>

        <div class="speech">“सूखी लकड़ी — मूल्य: 2 मायावी सिक्के। क्या आप इसे बेचना चाहते हैं?”</div>

        <p>वीर ने कुछ पल सोचा और बहुत धीरे से कहा, “हाँ…”</p>

        <p>अगले ही पल वह लकड़ी उसकी आँखों के सामने गायब हो गई। उसी क्षण सिस्टम पर उसका बैलेंस बदल गया—</p>

        <div class="speech">“502 मायावी सिक्के।”</div>

        <p>वीर अवाक रह गया। उसने अपनी मुट्ठी बाँधी। उसके सामने अब एक ऐसी दुनिया का दरवाज़ा खुल चुका था, जिसके बारे में उसने कभी सपने में भी नहीं सोचा था।</p>

        <p>तभी गाँव के बाहर से किसी के रोने और चीखने की आवाज़ आई। वीर का चेहरा गंभीर हो गया। उसने खंजर की ओर देखा, फिर चमकते हुए मायावी सिस्टम की ओर।</p>

        <p>उसे एहसास हो गया कि इस नई ताकत के साथ उसकी ज़िंदगी अब हमेशा के लिए बदलने वाली थी। लेकिन उसे अभी यह नहीं पता था कि उस रात की पुकार उसे किस रहस्य की ओर ले जाने वाली है…</p>

        <img class="story-illustration" src="../assets/stories/mayavi-exchange/chapter-01.png" alt="मायावी एक्सचेंज सिस्टम और वीर की नई शुरुआत" loading="lazy">

        <div class="speech">जारी रहेगा…</div>
      </div>
    </section>

<section class="story-chapter" id="chapter-2" data-chapter="2">

  <h2
    data-chapter-title
    data-hi="अध्याय 2 — गाँव का खतरा और पहली फाइटिंग एबिलिटी"
    data-en="Chapter 2 — The Threat to the Village and Veer's First Fighting Ability"
  >
    अध्याय 2 — गाँव का खतरा और पहली फाइटिंग एबिलिटी
  </h2>

  <div class="story-copy story-lang-hi chapter-text protected-content" data-lang="hi">

    <p>
      वीर तेज़ बारिश में गाँव की तरफ़ भागा। चीखने की आवाज़ उसके पड़ोसी, काका रमेश के घर से आ रही थी।
    </p>
<!-- Chapter 2 Image 1: वीर तेज़ बारिश में गाँव की तरफ़ भागा -->
    <img
      class="story-illustration"
      src="../assets/stories/mayavi-exchange/chapter-02-scene-01.png"
      alt="तेज़ बारिश में वीर काका रमेश के घर पहुँचता है"
      loading="lazy"
    >
    <p>
      जब वीर वहाँ पहुँचा, तो उसने देखा कि तीन अजीब, काले कपड़े पहने हुए लोग रमेश काका को घेरकर खड़े थे और उनसे किसी पुराने दस्तावेज़ के बारे में पूछ रहे थे। उन गुंडों के हाथों में तलवारें थीं।
    </p>

    <!-- Chapter 2 Image 1: Veer reaching Ramesh Kaka's house -->
    <img
      class="story-illustration"
      src="../assets/stories/mayavi-exchange/chapter-02-scene-02.png"
      alt="तेज़ बारिश में वीर काका रमेश के घर पहुँचता है"
      loading="lazy"
    >

    <p>
      वीर ने तुरंत अपनी नई ताकत <strong>'दृष्टि'</strong> का इस्तेमाल किया। उसने उन गुंडों की तरफ़ देखा और उसकी आँखों के सामने उनका स्टेटस दिखाई देने लगा:
    </p>

    <div class="speech">
      गुंडा 1: लेवल 5 फाइटर। कमजोरी: बायाँ पैर।<br><br>
      गुंडा 2: लेवल 4 फाइटर। कमजोरी: जल्दी गुस्सा आना।
    </div>

    <p>
      वीर को समझ आ गया कि बिना किसी हथियार या फाइटिंग स्किल के वह उनसे नहीं जीत सकता। उसने तुरंत अपने दिमाग में <strong>मायावी एक्सचेंज सिस्टम</strong> को याद किया।
    </p>

    <div class="speech">
      "सिस्टम! मुझे कोई फाइटिंग स्किल चाहिए। मेरे पास 502 कॉइन्स हैं!"
    </div>

    <p>
      वीर ने मन ही मन चिल्लाया।
    </p>

    <p>
      सिस्टम का इंटरफेस हवा में खुला और एक आवाज़ सुनाई दी:
    </p>

    <div class="speech">
      <strong>[शॉप विंडो अपडेटेड]</strong>
      <br><br>
      - <strong>बेसिक मार्शल आर्ट्स स्किल:</strong> 300 कॉइन्स
      <br>
      - <strong>आयरन बॉडी ऑरा (डिफेंसिव):</strong> 200 कॉइन्स
      <br><br>
      <em>क्या आप दोनों खरीदना चाहते हैं? कुल: 500 कॉइन्स।</em>
    </div>

    <div class="speech">
      "हाँ, तुरंत!"
    </div>

    <p>
      वीर ने कहा।
    </p>

    <div class="speech">
      <strong>[बैलेंस अपडेटेड: 2 कॉइन्स]</strong>
    </div>

    <p>
      अगले ही पल, वीर के दिमाग और शरीर में एक अजीब-सी ऊर्जा दौड़ गई। उसे ऐसा लगा जैसे वह वर्षों से मार्शल आर्ट्स की ट्रेनिंग ले रहा हो। उसका शरीर लोहे की तरह सख्त हो गया।
    </p>

    <!-- Chapter 2 Image 2: Veer activates his new fighting ability -->
    <img
      class="story-illustration"
      src="../assets/stories/mayavi-exchange/chapter-02-scene-03.png"
      alt="वीर को बेसिक मार्शल आर्ट्स और आयरन बॉडी ऑरा की शक्ति मिलती है"
      loading="lazy"
    >

    <div class="speech">
      "ए लड़के! वहाँ क्या खड़ा है? चला जा यहाँ से!"
    </div>

    <p>
      एक गुंडे ने वीर को देखते ही अपनी तलवार तान दी।
    </p>

    <div class="speech">
      "काका को छोड़ दो। अब तुम्हारा सामना मुझसे है।"
    </div>

    <p>
      वीर ने मुस्कुराते हुए कहा।
    </p>

    <p>
      गुस्से में गुंडा वीर की तरफ़ झपटा और उस पर तलवार से वार किया।
    </p>

    <p>
      लेकिन वीर ने अपनी <strong>दृष्टि</strong> की मदद से उसके वार को पहले ही भाँप लिया और एक कदम पीछे हट गया।
    </p>

    <p>
      अगले ही पल, वीर ने गुंडे के कमज़ोर हिस्से—उसके <strong>बाएँ पैर</strong> पर पूरी ताकत से एक ज़ोरदार किक मारी!
    </p>

    <div class="speech">
      <strong>छटाक्क!</strong>
    </div>

    <p>
