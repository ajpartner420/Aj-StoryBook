<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <!-- बस इन story-meta values को अपनी नई कहानी के अनुसार बदलें -->
  <meta name="story-title-hi" content="यहाँ कहानी का हिन्दी नाम">
  <meta name="story-title-en" content="English Story Title">
  <meta name="story-desc-hi" content="कहानी का छोटा परिचय।">
  <meta name="story-desc-en" content="Short story description.">
  <meta name="story-cover" content="../assets/stories/your-story/cover.jpg">
  <meta name="story-genres" content="Fantasy, Adventure">
  <meta name="story-status" content="ongoing">
  <meta name="story-feature" content="false">
  <title>नई कहानी | AJ StoryBooks</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div id="app"></div>
  <template id="storyTemplate">
    <div class="story-metadata" data-title-hi="यहाँ कहानी का हिन्दी नाम" data-title-en="English Story Title" data-desc-hi="कहानी का छोटा परिचय।" data-desc-en="Short story description." data-cover="../assets/stories/your-story/cover.jpg"></div>
    <a class="backlink" href="../stories.html">← कहानियों पर वापस</a>
    <header class="story-page-head">
      <img class="story-page-cover" data-story-cover src="../assets/stories/your-story/cover.jpg" alt="Story cover">
      <div><span class="status-badge">● जारी है</span><h1 data-story-title>यहाँ कहानी का नाम</h1><p data-story-desc>कहानी का परिचय</p></div>
      <div class="story-page-tools"><button class="iconbtn" id="fontDown">A−</button><button class="iconbtn" id="fontUp">A+</button></div>
    </header>
    <section class="story-intro"><h2>कहानी का परिचय</h2><p>यहाँ कहानी का पूरा परिचय लिखें।</p></section>
    <nav class="story-chapter-list" id="storyChapterList"></nav>
    <div class="story-coming" id="englishComingSoon" hidden><strong>English version coming soon.</strong><br>यह कहानी अभी हिन्दी में उपलब्ध है।<br><button class="btn small" id="readHindiBtn">हिन्दी में पढ़ें</button></div>

    <!-- नया chapter जोड़ने के लिए इसी section को copy करें -->
    <section class="story-chapter" id="chapter-1" data-chapter="1">
      <h2 data-chapter-title data-hi="अध्याय 1 — अध्याय का नाम" data-en="Chapter 1 — Chapter Title">अध्याय 1 — अध्याय का नाम</h2>
      <div class="story-copy story-lang-hi chapter-text protected-content" data-lang="hi">
        <p>यहाँ अध्याय 1 का पूरा हिन्दी text लिखें।</p>
        <img class="story-illustration" src="../assets/stories/your-story/chapter-01.jpg" alt="Chapter illustration" loading="lazy">
      </div>
    </section>

    <section class="audiobook-card"><div class="audio-icon">🎧</div><div class="audio-copy"><strong>ऑडियोबुक — जल्द आ रहा है</strong><small>इस कहानी की ऑडियो सुविधा बाद में उपलब्ध होगी।</small></div><span class="coming-pill">जल्द</span></section>
  </template>
  <script src="../js/app.js"></script>
</body>
</html>
